<title>Abhijeet Udyog Samuh</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Mukta:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: deep-red hero with the group banner framed beside the headline, a stats bar overlapping its edge, then promises, a three-generation timeline, clustered business tiles, founders and a red contact band. Each business opens as its own page in its own accent colour. */
:root {
  --bg: #FAF7F5;
  --surface: #FFFFFF;
  --fg: #2A1517;
  --muted: #6B5759;
  --line: #E8DCD9;
  --brand: #A8141B;
  --on-brand: #FFFFFF;
  --saffron: #E8821A;
  --gold: #F2B531;
  --hero-bg: #8F1017;
  --hero-bg2: #5E090E;
  --hero-fg: #FFFFFF;
  --tint: #F4EAE7;
  --shadow: 0 10px 30px rgba(70, 12, 16, 0.12);
  --lift: 0%;
  --font-display: "Yatra One", "Noto Serif Devanagari", Georgia, serif;
  --font-body: "Mukta", "Noto Sans Devanagari", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #150C0D; --surface: #221517; --fg: #F6EBE8; --muted: #BBA5A2; --line: #3A2629;
    --brand: #EE5A60; --on-brand: #1A0B0C; --saffron: #F29A38; --gold: #F2C14E;
    --hero-bg: #5E0B10; --hero-bg2: #36060A; --hero-fg: #FFFFFF; --tint: #2B1A1C;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.45); --lift: 38%; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #150C0D; --surface: #221517; --fg: #F6EBE8; --muted: #BBA5A2; --line: #3A2629;
  --brand: #EE5A60; --on-brand: #1A0B0C; --saffron: #F29A38; --gold: #F2C14E;
  --hero-bg: #5E0B10; --hero-bg2: #36060A; --hero-fg: #FFFFFF; --tint: #2B1A1C;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.45); --lift: 38%; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 7rem; }
body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 17px; line-height: 1.6; overflow-x: hidden; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; line-height: 1.15; margin: 0; text-wrap: balance; }
p { margin: 0; }
a { color: inherit; }
svg { display: block; }
:focus-visible { outline: 3px solid var(--saffron); outline-offset: 2px; }
.wrap { max-width: 1120px; margin-inline: auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.ph { border-bottom: 1.5px dashed var(--saffron); }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: color-mix(in srgb, var(--surface) 90%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 2px 14px; padding-block: 8px; }
.logo { display: flex; align-items: center; gap: 10px; text-decoration: none; margin-right: auto; min-width: 0; }
.mk { flex: none; width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--gold); color: #6A0A10; font-family: var(--font-display); font-size: 1.5rem; line-height: 1; padding-bottom: 4px; }
.logo span.t { display: flex; flex-direction: column; min-width: 0; }
.logo b { font-family: var(--font-display); font-weight: 400; font-size: 1.2rem; color: var(--brand); line-height: 1.1; }
.logo small { font-size: 0.74rem; color: var(--muted); letter-spacing: 0.04em; }
.nav { display: flex; gap: 2px; overflow-x: auto; order: 3; width: 100%; scrollbar-width: none; }
.nav a { padding: 6px 14px; text-decoration: none; font-weight: 600; font-size: 0.95rem; border-radius: 999px; white-space: nowrap; }
.nav a:hover { background: var(--tint); }
.ctl { display: flex; gap: 8px; }
.ctl button { font: inherit; font-weight: 700; font-size: 0.88rem; cursor: pointer; color: var(--fg); background: var(--tint); border: 1px solid var(--line); border-radius: 999px; padding: 4px 14px; min-height: 36px; }
.ctl button:hover { border-color: var(--saffron); }
@media (min-width: 840px) { .nav { order: 0; width: auto; } }

/* hero */
.hero { position: relative; color: var(--hero-fg); background: linear-gradient(160deg, var(--hero-bg), var(--hero-bg2)); }
.hero::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--saffron), var(--gold), var(--saffron)); }
.hero .wrap { display: grid; justify-items: center; text-align: center; padding-block: 72px 112px; }
.kicker { font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.8rem; color: var(--gold); }
.hero h1 { font-size: clamp(2.4rem, 6.6vw, 4.2rem); margin-top: 18px; max-width: 16ch; }
.hero .lead { max-width: 44ch; font-size: 1.15rem; margin-top: 20px; opacity: 0.92; }
.hero .actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 32px; }
.btn { display: inline-flex; align-items: center; justify-content: center; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer; padding: 11px 24px; border-radius: 4px; border: 2px solid transparent; min-height: 46px; transition: transform 0.15s ease, filter 0.15s ease; }
.btn:hover { transform: translateY(-2px); filter: brightness(1.07); }
.btn.solid { background: var(--gold); color: #2A1517; }
.btn.line { border-color: rgba(255, 255, 255, 0.65); color: #fff; }
.btn.primary { background: var(--brand); color: var(--on-brand); }
.frame { position: relative; margin: 0 14px 14px 0; }
.frame::before { content: ""; position: absolute; inset: 14px -14px -14px 14px; border: 2px solid var(--gold); z-index: 0; }
.frame img { position: relative; z-index: 1; width: 100%; height: auto; background: #fff; box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35); }
.frame figcaption { position: relative; z-index: 1; margin-top: 10px; font-size: 0.82rem; opacity: 0.8; }

/* stats */
.stats-wrap { margin-top: -48px; position: relative; z-index: 2; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--surface); box-shadow: var(--shadow); border: 1px solid var(--line); }
.stat { padding: 26px 12px; text-align: center; border-right: 1px solid var(--line); }
.stat:last-child { border-right: 0; }
.stat b { display: block; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.3rem, 8vw, 3.6rem); color: var(--brand); line-height: 1; font-variant-numeric: tabular-nums; }
.stat span { display: block; margin-top: 6px; color: var(--muted); font-weight: 600; font-size: 0.82rem; letter-spacing: 0.08em; text-transform: uppercase; }

/* sections */
section.band { padding-block: 84px; }
section.alt { background: var(--tint); }
.sec-head { display: grid; gap: 10px; margin-bottom: 40px; max-width: 62ch; }
.eyebrow { font-weight: 800; letter-spacing: 0.14em; text-transform: uppercase; font-size: 0.76rem; color: var(--saffron); }
.sec-head h2 { font-size: clamp(1.8rem, 4.4vw, 2.7rem); color: var(--brand); }
.sec-head p { color: var(--muted); font-size: 1.05rem; }

/* values */
.vals { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.val { position: relative; overflow: hidden; background: var(--surface); border: 1px solid var(--line); padding: 28px 26px 30px; display: grid; gap: 10px; align-content: start; }
.val .ico { width: 52px; height: 52px; color: var(--brand); }
.val .big { position: absolute; right: 12px; top: -8px; font-family: var(--font-display); font-size: 5.2rem; line-height: 1; color: var(--brand); opacity: 0.08; pointer-events: none; }
.val h3 { font-size: 1.5rem; }
.val p { color: var(--muted); }

/* timeline */
.gens { position: relative; display: grid; gap: 28px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); padding-top: 8px; }
@media (min-width: 860px) { .gens { grid-template-columns: repeat(3, 1fr); } .gens::before { content: ""; position: absolute; top: 31px; left: 16.6%; right: 16.6%; height: 3px; background: linear-gradient(90deg, var(--saffron), var(--brand), var(--gold)); } }
.gen { position: relative; display: grid; gap: 14px; justify-items: center; text-align: center; }
.node { position: relative; z-index: 1; width: 48px; height: 48px; border-radius: 50%; display: grid; place-items: center; background: var(--surface); border: 3px solid var(--brand); color: var(--brand); font-family: var(--font-display); font-size: 1.15rem; padding-bottom: 2px; }
.gen:nth-child(1) .node { border-color: var(--saffron); color: var(--saffron); }
.gen:nth-child(3) .node { border-color: var(--gold); color: var(--gold); }
.gcard { width: 100%; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow); padding: 22px; display: grid; gap: 12px; justify-items: center; }
.gcard .tag { font-weight: 800; font-size: 0.74rem; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.gcard h3 { font-size: 1.3rem; }
.gcard p { color: var(--muted); font-size: 0.97rem; }
.avatar { width: 112px; height: 112px; border-radius: 50%; display: grid; place-items: center; background: var(--tint); border: 2px dashed var(--saffron); color: var(--muted); }
.avatar svg { width: 50px; height: 50px; }

/* clusters + tiles */
.cluster + .cluster { margin-top: 52px; }
.chead { display: grid; gap: 4px; margin-bottom: 18px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.chead h3 { font-size: 1.45rem; }
.chead p { color: var(--muted); max-width: 70ch; }
.tiles { display: grid; gap: 18px; }
.t2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.t3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 250px), 1fr)); }
.t4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.tile { --as: color-mix(in srgb, var(--a), white var(--lift)); position: relative; overflow: hidden; display: grid; gap: 6px; align-content: start; min-width: 0; text-decoration: none; background: var(--surface); border: 1px solid var(--line); padding: 24px; transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease; }
.tile:hover { transform: translateY(-5px); box-shadow: var(--shadow); border-color: var(--as); }
.tile .ic { width: 60px; height: 60px; display: grid; place-items: center; color: var(--as); background: color-mix(in srgb, var(--as) 14%, var(--surface)); margin-bottom: 10px; transition: background 0.2s ease, color 0.2s ease; }
.tile:hover .ic { background: var(--as); color: var(--surface); }
.tile .ic svg { width: 34px; height: 34px; }
.tile h3 { font-size: 1.4rem; position: relative; z-index: 1; }
.tile .mr { color: var(--as); font-weight: 700; font-size: 0.95rem; position: relative; z-index: 1; }
.tile p { color: var(--muted); font-size: 0.97rem; position: relative; z-index: 1; margin-top: 4px; }
.tile .go { margin-top: 12px; font-weight: 800; font-size: 0.88rem; letter-spacing: 0.04em; color: var(--as); position: relative; z-index: 1; }
.tile.big { padding: 30px; }
.tile.big h3 { font-size: 1.8rem; }
.tile.big .ic { width: 72px; height: 72px; }
.tile.big .ic svg { width: 42px; height: 42px; }
.tile.big::after { content: attr(data-mr); position: absolute; right: -6px; bottom: -22px; font-family: var(--font-display); font-size: 6.2rem; line-height: 1; color: var(--as); opacity: 0.07; white-space: nowrap; pointer-events: none; }
.badge { position: absolute; top: 16px; right: 16px; z-index: 2; background: var(--gold); color: #2A1517; font-weight: 800; font-size: 0.7rem; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 10px; }

/* founders */
.founders { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.fcard { position: relative; display: grid; gap: 16px 18px; grid-template-columns: 96px 1fr; align-items: center; background: var(--surface); border: 1px solid var(--line); padding: 24px; }
.fcard .avatar { width: 96px; height: 96px; }
.fcard h3 { font-size: 1.25rem; display: inline-block; }
.fcard .role { color: var(--brand); font-weight: 700; font-size: 0.88rem; margin-top: 4px; }
.fcard blockquote { margin: 0; grid-column: 1 / -1; color: var(--muted); padding-left: 16px; border-left: 3px solid var(--gold); font-size: 1rem; }

/* contact band */
.cband { background: linear-gradient(135deg, var(--hero-bg), var(--hero-bg2)); color: var(--hero-fg); position: relative; overflow: hidden; }
.cband .sec-head h2 { color: #fff; }
.cband .sec-head p { color: rgba(255, 255, 255, 0.82); }
.cband .eyebrow { color: var(--gold); }
.contact { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 240px), 1fr)); }
.contact div { background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2); padding: 20px 22px; }
.contact h3 { font-size: 1.05rem; color: var(--gold); margin-bottom: 6px; }
.contact .ph { border-bottom-color: var(--gold); }
footer { background: #1E0709; color: #F3DDD9; padding-block: 36px; font-size: 0.92rem; }
footer .wrap { display: grid; gap: 14px; }
footer .links { display: flex; flex-wrap: wrap; gap: 6px 20px; }
footer a { text-decoration: none; opacity: 0.85; }
footer a:hover { opacity: 1; text-decoration: underline; }
footer .fine { opacity: 0.6; font-size: 0.82rem; }

/* business page */
.bhead { --as: color-mix(in srgb, var(--a), white var(--lift)); color: var(--hero-fg); position: relative; overflow: hidden; background: linear-gradient(120deg, var(--hero-bg) 20%, color-mix(in srgb, var(--a) 60%, var(--hero-bg2))); }
.bhead::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 6px; background: linear-gradient(90deg, var(--gold), var(--saffron)); }
.bhead .wrap { display: grid; gap: 28px; align-items: center; padding-block: 44px 56px; position: relative; z-index: 1; }
@media (min-width: 900px) { .bhead .wrap.has-img { grid-template-columns: 1.2fr 0.8fr; } }
.bhead .bic { width: 76px; height: 76px; display: grid; place-items: center; background: rgba(255, 255, 255, 0.14); border: 1px solid rgba(255, 255, 255, 0.35); color: #fff; margin-bottom: 18px; }
.bhead .bic svg { width: 44px; height: 44px; }
.bhead h1 { font-size: clamp(2.1rem, 5.6vw, 3.4rem); }
.bhead .mr { font-family: var(--font-display); color: var(--gold); font-size: 1.3rem; margin-top: 6px; }
.bhead .tg { margin-top: 10px; font-weight: 700; font-size: 1.1rem; }
.bhead .desc { margin-top: 10px; max-width: 54ch; opacity: 0.93; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
.chip { padding: 4px 12px; font-size: 0.82rem; font-weight: 700; border: 1px solid rgba(255, 255, 255, 0.4); background: rgba(255, 255, 255, 0.1); }
.bhead .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 24px; }
.bhead .frame img { max-height: 340px; object-fit: cover; }
.crumb { display: inline-block; margin-block: 28px 4px; font-weight: 700; color: var(--brand); text-decoration: none; }
.crumb:hover { text-decoration: underline; }
.bbody { display: grid; gap: 24px; padding-block: 12px 72px; }
.cols { display: grid; gap: 22px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }
.panel { --as: color-mix(in srgb, var(--a), white var(--lift)); background: var(--surface); border: 1px solid var(--line); padding: 26px; display: grid; gap: 14px; min-width: 0; }
.panel h2 { font-size: 1.35rem; color: var(--brand); }
.checks { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.checks li { display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: start; font-weight: 600; }
.checks li::before { content: "✓"; display: grid; place-items: center; width: 26px; height: 26px; background: color-mix(in srgb, var(--as) 16%, var(--surface)); color: var(--as); font-weight: 800; }
.gal { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.slot { aspect-ratio: 4 / 3; max-width: 100%; display: grid; place-items: center; text-align: center; background: var(--tint); border: 1.5px dashed var(--line); color: var(--muted); font-size: 0.88rem; padding: 8px; overflow: hidden; }
.slot img { width: 100%; height: 100%; object-fit: cover; }
label { display: grid; gap: 5px; font-weight: 700; font-size: 0.9rem; }
input, textarea { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 9px 12px; width: 100%; border-radius: 3px; min-height: 46px; }
input:focus, textarea:focus { border-color: var(--saffron); }
textarea { min-height: 100px; resize: vertical; }
.emi-out { background: var(--tint); padding: 16px 18px; display: flex; flex-wrap: wrap; justify-content: space-between; align-items: baseline; gap: 6px; border-left: 4px solid var(--gold); }
.emi-out b { font-family: var(--font-display); font-weight: 400; font-size: 2.1rem; color: var(--brand); font-variant-numeric: tabular-nums; }
.note { color: var(--muted); font-size: 0.86rem; }
.status { font-weight: 700; color: var(--brand); }
.related { display: flex; flex-wrap: wrap; gap: 10px; }
.related a { padding: 8px 16px; border: 1px solid var(--line); background: var(--surface); text-decoration: none; font-weight: 700; font-size: 0.92rem; transition: border-color 0.15s ease, transform 0.15s ease; }
.related a:hover { border-color: var(--saffron); transform: translateY(-2px); }

.reveal { transform: translateY(18px); transition: transform 0.6s ease; }
.reveal.in { transform: none; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  .reveal, .tile, .btn { transition: none; transform: none; }
}
</style>

<header class="top">
  <div class="wrap">
    <a class="logo" href="#top"><span class="mk">अ</span><span class="t"><b data-i18n="logo_name"></b><small data-i18n="logo_tag"></small></span></a>
    <div class="ctl">
      <button id="langBtn" type="button" aria-label="Switch language">मराठी</button>
      <button id="themeBtn" type="button" aria-label="Switch light or dark theme">◐</button>
    </div>
    <nav class="nav" aria-label="Sections">
      <a href="#legacy" data-i18n="nav_legacy"></a>
      <a href="#brands" data-i18n="nav_brands"></a>
      <a href="#founders" data-i18n="nav_founders"></a>
      <a href="#contact" data-i18n="nav_contact"></a>
    </nav>
  </div>
</header>

</main>

<main id="biz" hidden></main>

<footer>
  <div class="wrap">
    <div><b style="font-family: var(--font-display); font-weight: 400; font-size: 1.2rem;" data-i18n="logo_name"></b> · विश्वासाची परंपरा</div>
    <div class="links" id="flinks"></div>
    <div class="fine" data-i18n="fine"></div>
  </div>

      mr: { n: "फार्मट्रॅक", t: "शेतासाठी ट्रॅक्टर", d: "फार्मट्रॅक ट्रॅक्टरची माहिती, प्रात्यक्षिक आणि फायनान्सची चौकशी.", i: ["ट्रॅक्टर मॉडेल्स", "प्रात्यक्षिक बुक करा", "फायनान्स आणि EMI चौकशी"] },

      mr: { n: "ॲग्रोटेक", t: "पिकासाठी लागणारे सर्व काही", d: "शेतीसाठी लागणाऱ्या वस्तू आणि पीकनिहाय मार्गदर्शन.", i: ["कृषी वस्तूंची यादी", "पीकनिहाय मार्गदर्शन", "वस्तूंची चौकशी"] },

      en: { n: "Farm", t: "Grown by the family", d: "Produce and seasons from our own farm.", i: ["Produce and seasons", "Direct purchase enquiry", "Visit the farm"] } },
    { id: "santra", a: "#E8821A", c: 2,
      mr: { n: "संत्रा पॅकिंग", t: "बागेपासून बाजारापर्यंत", d: "संत्र्याची प्रतवारी आणि पॅकिंग, घाऊक व्यापाऱ्यांसाठी.", i: ["प्रतवारी आणि पॅकिंग", "घाऊक चौकशी", "हंगामातील उपलब्धता"] },
      en: { n: "Santra Packing", t: "From orchard to market", d: "Grading and packing of oranges, for wholesalers and bulk buyers.", i: ["Grading and packing", "Bulk and wholesale enquiry", "Seasonal availability"] } },
    { id: "sawmill", a: "#8A5A33", c: 3,
      mr: { n: "सॉ मिल", t: "गरजेनुसार कापलेले लाकूड", d: "लाकडाचे प्रकार, आकार आणि मागणीनुसार कटिंग.", i: ["लाकडाचे प्रकार आणि आकार", "मागणीनुसार कटिंग", "मोठ्या मागणीसाठी दरपत्रक"] },
      en: { n: "Saw Mill", t: "Timber, cut to need", d: "Timber types, sizes and cutting to your requirement.", i: ["Timber types and sizes", "Custom cutting enquiry", "Bulk quote"] } },
    { id: "traders", a: "#46607A", c: 3,
      mr: { n: "ट्रेडर्स", t: "स्टील आणि बांधकाम साहित्य", d: "TMT सळई आणि बांधकाम साहित्य, कंत्राटदार आणि घर बांधणाऱ्यांसाठी.", i: ["TMT सळईचे प्रकार आणि आकार", "कंत्राटदारांसाठी दरपत्रक", "मोठ्या मागणीची चौकशी"] },
      en: { n: "Traders", t: "Steel and building materials", d: "TMT bars and building materials for contractors and home builders.", i: ["TMT bar grades and sizes", "Contractor quote", "Bulk enquiry"] } },
    { id: "fuels", a: "#C48A00", c: 3,
      mr: { n: "फ्युएल्स", t: "भरवशाचे इंधन", d: "पेट्रोल पंपाचे ठिकाण, वेळा आणि सेवा.", i: ["ठिकाण आणि वेळा", "पंपावरील सेवा", "वाहनताफा आणि मोठ्या मागणीची चौकशी"] },
      en: { n: "Fuels", t: "Fuel you can count on", d: "Our petrol pump: location, timings and services.", i: ["Location and timings", "Services at the pump", "Fleet and bulk enquiry"] } },
    { id: "cloth", a: "#B03A78", c: 3,
      mr: { n: "क्लॉथ सेंटर", t: "प्रत्येक प्रसंगासाठी कापड", d: "कापडाचे नवे संग्रह आणि सणासुदीच्या ऑफर्स.", i: ["संग्रह", "सणासुदीच्या ऑफर्स", "दुकानाला भेट द्या"] },
      en: { n: "Cloth Center", t: "Cloth for every occasion", d: "New collections and festival offers.", i: ["Collections", "Festival offers", "Visit the store"] } }
  ];

  var lang = "en", root = document.documentElement, reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  try { var sl = localStorage.getItem("aus-lang-v2"); if (sl === "en" || sl === "mr") lang = sl; } catch (e) {}
  try { var st = localStorage.getItem("aus-theme"); if (st === "light" || st === "dark") root.setAttribute("data-theme", st); } catch (e) {}

  function t(k) { return T[lang][k]; }
  function other() { return lang === "en" ? "mr" : "en"; }
  function $(s) { return document.querySelector(s); }
  function fmt(n) { return Math.round(n).toLocaleString("en-IN"); }
  function byId(id) { return BIZ.filter(function (z) { return z.id === id; })[0]; }

  function tile(x, big) {
    var c = x[lang], o = x[other()];
    return "<a class='tile reveal" + (big ? " big" : "") + "' style='--a:" + x.a + "' data-mr='" + x.mr.n + "' href='#" + x.id + "'>" +
      (x.isNew ? "<span class='badge'>" + t("isnew") + "</span>" : "") +
      "<span class='ic'>" + ICON[x.id] + "</span><h3>" + c.n + "</h3><span class='mr'>" + o.n + "</span>" +
      "<p>" + (big ? c.d : c.t) + "</p><span class='go'>" + t("open") + "</span></a>";
  }

  function renderHome() {
    var v = "";
    [["trust", "v1"], ["family", "v2"], ["legacy", "v3"]].forEach(function (p) {
      v += "<article class='val reveal'><span class='big'>" + t(p[1] + "_w") + "</span><span class='ico'>" + ICON[p[0]] + "</span><h3>" + t(p[1] + "_t") + "</h3><p>" + t(p[1] + "_p") + "</p></article>";
    });
    $("#vals").innerHTML = v;

    var g = "", roman = ["I", "II", "III"];
    for (var i = 0; i < 3; i++) {
      g += "<article class='gen reveal'><span class='node'>" + roman[i] + "</span><div class='gcard'><span class='tag'>" + t("gen_tag")[i] + "</span>" +
        "<div class='avatar'>" + ICON.person + "</div><h3 class='ph'>" + t("gen_name") + "</h3><p>" + t("gen_txt") + "</p></div></article>";
    }
    $("#gens").innerHTML = g;

    var cl = "";
    [1, 2, 3].forEach(function (n) {
      var items = BIZ.filter(function (x) { return x.c === n; });
      cl += "<div class='cluster'><div class='chead'><h3>" + t("cl" + n + "_h") + "</h3><p>" + t("cl" + n + "_p") + "</p></div>" +
        "<div class='tiles " + (n === 1 ? "t2" : n === 2 ? "t3" : "t4") + "'>" + items.map(function (x) { return tile(x, n === 1); }).join("") + "</div></div>";
    });
    $("#clusters").innerHTML = cl;

    var f = "";
    for (var j = 0; j < 3; j++) {
      f += "<article class='fcard reveal'><div class='avatar'>" + ICON.person + "</div><div><h3 class='ph'>" + t("f_name") +
        "</h3><div class='role'>" + t("f_role") + "</div></div><blockquote>" + t("f_quote") + "</blockquote></article>";
    }
    $("#founders-list").innerHTML = f;

    observe();
  }

  function renderBiz(id) {
    var x = byId(id), c = x[lang], o = x[other()];
    var h = "<div class='bhead' style='--a:" + x.a + "'><div class='wrap" + (x.img ? " has-img" : "") + "'><div>" +
      "<span class='bic'>" + ICON[id] + "</span><h1>" + c.n + "</h1><div class='mr'>" + o.n + "</div>" +
      "<div class='tg'>" + c.t + "</div><p class='desc'>" + c.d + "</p>" +
      "<div class='chips'><span class='chip'>" + t("chip_part") + "</span>" + (x.isNew ? "<span class='chip'>" + t("isnew") + "</span>" : "") + "<span class='chip ph'>+91 00000 00000</span></div>" +
      "<div class='actions'><button class='btn solid' id='goEnq' type='button'>" + t("cta_enq") + "</button><a class='btn line' href='#top'>" + t("cta_home") + "</a></div></div>" +
      (x.img ? "<figure class='frame' style='margin-bottom:14px'><img src='" + x.img + "' alt='" + c.n + " showroom' width='295' height='223'></figure>" : "") +
      "</div></div>";
    h += "<div class='wrap' style='--a:" + x.a + "'><a class='crumb' href='#brands'>" + t("back") + "</a><div class='bbody'>";
    h += "<div class='cols'><div class='panel'><h2>" + t("what") + "</h2><ul class='checks'>" + c.i.map(function (s) { return "<li>" + s + "</li>"; }).join("") + "</ul></div>";
    if (x.emi) {
      h += "<div class='panel'><h2>" + t("emi") + "</h2>" +
        "<label for='emiP'>" + t("price") + "<input id='emiP' type='number' min='0' step='1000' value='" + x.emi[0] + "'></label>" +
        "<label for='emiD'>" + t("down") + "<input id='emiD' type='number' min='0' step='1000' value='" + x.emi[1] + "'></label>" +
        "<label for='emiR'>" + t("rate") + "<input id='emiR' type='number' min='0' step='0.5' value='" + x.emi[2] + "'></label>" +
        "<label for='emiN'>" + t("months") + "<input id='emiN' type='number' min='1' step='1' value='" + x.emi[3] + "'></label>" +
        "<div class='emi-out'><span>" + t("emi_out") + "</span><b id='emiV'>–</b></div><p class='note'>" + t("emi_note") + "</p></div>";
    }
    h += "<div class='panel' id='enqPanel'><h2>" + t("enq") + "</h2><form id='enqForm' novalidate><div style='display:grid;gap:14px'>" +
      "<label for='eqN'>" + t("f_n") + "<input id='eqN' type='text' autocomplete='name'></label>" +
      "<label for='eqP'>" + t("f_p") + "<input id='eqP' type='tel' autocomplete='tel'></label>" +
      "<label for='eqM'>" + t("f_m") + "<textarea id='eqM'></textarea></label>" +
      "<button class='btn primary' type='submit'>" + t("send") + "</button>" +
      "<p class='status' id='eqS' role='status'></p></div></form></div></div>";
    h += "<div class='panel'><h2>" + t("find") + "</h2><p class='ph' style='justify-self:start'>" + t("addr_hours") + "</p></div>";
    var slot = "<div class='slot'>" + t("photo") + "</div>";
    h += "<div class='panel'><h2>" + t("gallery") + "</h2><div class='gal'>" +
      (x.img ? "<div class='slot'><img src='" + x.img + "' alt='" + c.n + " showroom'></div>" : slot) + slot + slot + "</div></div>";
    h += "<div class='panel'><h2>" + t("related") + "</h2><div class='related'>" +
      BIZ.filter(function (z) { return z.id !== id; }).map(function (z) { return "<a href='#" + z.id + "'>" + z[lang].n + "</a>"; }).join("") + "</div></div>";
    h += "</div></div>";
    $("#biz").innerHTML = h;
    document.title = c.n + " | " + T[lang].logo_name;

    if (x.emi) {
      var calc = function () {
        var P = (+$("#emiP").value || 0) - (+$("#emiD").value || 0);
        var r = (+$("#emiR").value || 0) / 1200, n = Math.max(1, Math.round(+$("#emiN").value || 1));
        var e = P <= 0 ? 0 : (r ? P * r * Math.pow(1 + r, n) / (Math.pow(1 + r, n) - 1) : P / n);
        $("#emiV").textContent = "₹ " + fmt(e);
      };
      ["#emiP", "#emiD", "#emiR", "#emiN"].forEach(function (s) { $(s).addEventListener("input", calc); });
      calc();
    }
    $("#enqForm").addEventListener("submit", function (ev) { ev.preventDefault(); $("#eqS").textContent = t("sent"); });
    $("#goEnq").addEventListener("click", function () { $("#enqPanel").scrollIntoView({ behavior: reduce ? "auto" : "smooth", block: "center" }); });
  }

  function applyText() {
    root.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.getAttribute("data-i18n")); });
    $("#langBtn").textContent = lang === "en" ? "मराठी" : "EN";
    $("#flinks").innerHTML = ["legacy", "brands", "founders", "contact"].map(function (k) { return "<a href='#" + k + "'>" + t("nav_" + k) + "</a>"; }).join("");
  }

  function route() {
    var id = (location.hash || "").replace("#", "");
    var isBiz = !!byId(id);
    $("#home").hidden = isBiz;
    $("#biz").hidden = !isBiz;
    if (isBiz) { renderBiz(id); window.scrollTo(0, 0); }
    else { document.title = T[lang].logo_name; renderHome(); }
  }

  function observe() {
    var els = document.querySelectorAll(".reveal");
    if (!("IntersectionObserver" in window)) { els.forEach(function (e) { e.classList.add("in"); }); return; }
    var io = new IntersectionObserver(function (en) {
      en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    els.forEach(function (e) { io.observe(e); });
  }

  var counted = false;
  function countUp() {
    if (counted || reduce || !("IntersectionObserver" in window)) return;
    var box = $("#stats");
    var io = new IntersectionObserver(function (en) {
      if (!en[0].isIntersecting || counted) return;
      counted = true; io.disconnect();
      box.querySelectorAll("b").forEach(function (b) {
        var end = +b.getAttribute("data-n"), t0 = null;
        function step(ts) {
          if (t0 === null) t0 = ts;
          var p = Math.min(1, (ts - t0) / 900);
          b.textContent = Math.max(1, Math.round(end * p));
          if (p < 1) requestAnimationFrame(step); else b.textContent = end;
        }
        requestAnimationFrame(step);
      });
    }, { threshold: 0.6 });
    io.observe(box);
  }

  $("#langBtn").addEventListener("click", function () {
    lang = other();
    try { localStorage.setItem("aus-lang-v2", lang); } catch (e) {}
    applyText(); route();
  });
  $("#themeBtn").addEventListener("click", function () {
    var dark = root.getAttribute("data-theme") === "dark" ||
      (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
    var next = dark ? "light" : "dark";
    root.setAttribute("data-theme", next);
    try { localStorage.setItem("aus-theme", next); } catch (e) {}
  });
  window.addEventListener("hashchange", function () {
    route();
    var id = (location.hash || "").replace("#", "");
    if (id && !byId(id)) {
      var el = document.getElementById(id);
      if (el) setTimeout(function () { el.scrollIntoView(); }, 0);
    }
  });

  applyText();
  route();
  countUp();
})();
</script>
